<p className="mt-8 text-sm max-w-3xl">Tarifs indicatifs, confirmés après une séance de cadrage. Hors taxes, déplacements en sus. Paiement en 40 %, 30 % et 30 % pour Accélération et Transformation. Tarif solidaire possible pour les OCB et les ONG locales.</p></div></section></>}

function Coach(){return <><div className="relative overflow-hidden border-b border-line"><div className="ring"/><div className={W+" relative grid md:grid-cols-[1.4fr_1fr] gap-10 items-center py-14 md:py-20"}><div><h1 className="font-serif text-4xl md:text-6xl font-semibold tracking-tight text-ink mb-4">Moussa SY</h1><p className="text-lg md:text-xl max-w-xl">Sociologue, coach professionnel certifié, facilitateur, enseignant-formateur et fondateur de Khazina Group.</p>
<div className="flex flex-wrap gap-10 mt-8">{[["20+","ans d’accompagnement en Afrique"],["4","langues de travail"],["3","diplômes : DEA, MBA, DBA"]].map(([n,t])=><div key={n}><b className="block font-serif text-5xl text-gt leading-none">{n}</b><span className="text-sm">{t}</span></div>)}</div></div>
<img src={PHOTO} alt="Portrait de Moussa SY" className="justify-self-center w-[min(70%,320px)] rounded-full border-[8px] border-gold"/></div></div>
<section className="py-16"><div className={W+" grid md:grid-cols-[1.5fr_1fr] gap-12"}><div><H2>Parcours</H2><p>Plus de vingt ans à concevoir, diriger et évaluer des programmes de développement en Afrique de l’Ouest, comme directeur de projet, conseiller principal ou coordonnateur régional pour l’USAID, le PNUD, la FAO, ONU-Habitat, le CRDI, la Commission européenne et la Coopération néerlandaise. Débuts en microfinance, agriculture urbaine et coopératives, au Sénégal, au Bénin, en Mauritanie et au Burkina Faso.</p>
<H2 c="mt-10">Formation et certifications</H2><Ul a={["Coaching professionnel (Beautiful Soul), août 2026","« Fondements du coaching de vie » (Roger Kay Allen, Ph.D.)","Doctor of Business Administration (2026) et Master of Business Administration","DEA (2000), maîtrise (1998) et licence (1996) en sociologie, Université Gaston Berger de Saint-Louis","Enseignant-formateur vacataire, encadrement de mémoires et de thèses"]}/></div>
<div><div className="bg-soft rounded-2xl p-7 border border-line"><h3 className="font-serif text-xl text-ink mb-3">Domaines d’intervention</h3><Ul a={["Management humain et leadership","Renforcement organisationnel","Suivi-évaluation et apprentissage","Facilitation stratégique et gestion adaptative","Mobilisation communautaire"]}/></div>
<p className="font-serif text-xl text-ink mt-8">Une lecture sociologique, la rigueur d’un gestionnaire de programmes, l’écoute d’un coach certifié.</p></div></div></section></>}

function Reserver(){const [f,setF]=useState({offre:OFFER,pays:"sn",nom:"",mode:"Présentiel",msg:""});const [out,setOut]=useState(null);
const set=k=>e=>setF({...f,[k]:e.target.value});
const go=e=>{e.preventDefault();const t="Bonjour, je souhaite réserver : "+f.offre+".\nNom : "+f.nom+"\nFormat : "+f.mode+(f.msg?"\nMon besoin : "+f.msg:"")+"\nMerci de me recontacter.";setOut({t,u:wa(NUM[f.pays],t)})};
const I="w-full rounded-md border border-line bg-bg text-body px-3 py-3";const L="block font-bold text-ink mt-5 mb-1";
return <><Head t="Réserver" p="Écrivez-nous, nous échangeons pour vous orienter, puis vous réservez et nous passons à l’action."/>
<section className="py-16"><div className={W+" grid md:grid-cols-[1.4fr_1fr] gap-12"}><div><form onSubmit={go} className="max-w-xl">
<label className={L+" mt-0"}>Offre souhaitée</label><select className={I} value={f.offre} onChange={set("offre")}>{["SAKINA — coaching individuel (90 min)","SAKINA Afterwork","SAKINA Week-end","LEVIER 360 — Focus","LEVIER 360 — Accélération","LEVIER 360 — Transformation","Je ne sais pas encore, j’ai besoin d’être orienté(e)"].map(o=><option key={o}>{o}</option>)}</select>
<label className={L}>Numéro WhatsApp à contacter</label><select className={I} value={f.pays} onChange={set("pays")}><option value="sn">Sénégal</option><option value="ma">Maroc</option></select>
<label className={L}>Votre nom (ou pseudonyme)</label><input className={I} required value={f.nom} onChange={set("nom")} autoComplete="name"/>
<label className={L}>Format souhaité</label><select className={I} value={f.mode} onChange={set("mode")}><option>Présentiel</option><option>Visio</option><option>Appel audio</option></select>
<label className={L}>Quelques mots sur votre besoin (facultatif)</label><textarea className={I} rows="4" value={f.msg} onChange={set("msg")}/>
<button className={"mt-6 rounded-md px-6 py-3 font-bold "+V.green}>Préparer mon message</button></form>
{out&&<div aria-live="polite" className="mt-8 max-w-xl bg-soft border-l-4 border-g p-5"><pre className="whitespace-pre-wrap font-sans mb-4">{out.t}</pre><a href={out.u} target="_blank" rel="noopener" className={"inline-block rounded-md px-6 py-3 font-bold "+V.green}>Envoyer sur WhatsApp</a></div>}</div>
<aside className="bg-soft border border-line rounded-2xl p-7 h-fit"><h3 className="font-serif text-xl text-ink mb-4">Autres moyens</h3><p>WhatsApp Sénégal<br/><b className="text-ink">+221 76 790 47 92</b></p><p>WhatsApp Maroc<br/><b className="text-ink">+212 (0)7 27 92 58</b></p><p className="mb-0">E-mail<br/><a className="text-gt underline" href="mailto:contact@khazinagroup.org">contact@khazinagroup.org</a></p></aside></div></section></>}

const PAGES={accueil:Home,sakina:Sakina,groupes:Groupes,levier:Levier,coach:Coach,reserver:Reserver};
function App(){const get=()=>{const h=location.hash.slice(1);return PAGES[h]?h:"accueil"};
const [p,setP]=useState(get);const [open,setOpen]=useState(false);
useEffect(()=>{const f=()=>{setP(get());setOpen(false);window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
const Page=PAGES[p];
const lk=(k,t)=><a key={k} href={"#"+k} aria-current={p===k?"page":undefined} className={"block px-3 py-2 md:py-1 border-b-2 text-[.95rem] font-medium "+(p===k?"text-gt border-gold":"text-body border-transparent hover:text-ink")}>{t}</a>;
return <>
<header className="sticky z-50 bg-bg border-b border-line" style={{top:"env(safe-area-inset-top,0px)"}}><div className={W+" flex items-center justify-between min-h-[68px]"}>
<a href="#accueil" className="flex items-center gap-3 font-serif text-lg font-semibold text-ink"><img src={LOGO} alt="" className="w-10 h-10 rounded-full"/>Khazina Group</a>
<nav className="hidden md:flex items-center gap-3" aria-label="Navigation principale">{NAV.map(([k,t])=>lk(k,t))}<a href="#reserver" className={"rounded-md px-4 py-2 font-bold "+V.green}>Réserver</a></nav>
<button className="md:hidden border border-line text-ink rounded-md px-3 py-1.5 text-sm" aria-expanded={open} onClick={()=>setOpen(!open)}>{open?"Fermer":"Menu"}</button></div>
{open&&<nav className="md:hidden border-t border-line px-3 pb-4" aria-label="Navigation principale">{NAV.map(([k,t])=>lk(k,t))}<a href="#reserver" className={"mt-3 block text-center rounded-md px-4 py-3 font-bold "+V.green}>Réserver</a></nav>}</header>
<main><Page key={p}/></main>
<footer className="bg-soft border-t border-line py-10"><div className={W+" flex flex-wrap gap-6 justify-between items-center"}><div className="flex items-center gap-3"><img src={LOGO} alt="" className="w-12 h-12 rounded-full"/><div><b className="text-ink font-serif text-lg">Khazina Group</b><br/>Écoute, coaching, impact</div></div><div>Révélez votre potentiel. Clarifiez vos choix. Passez à l’action.</div><a className="text-gt underline" href="https://www.khazinagroup.org">www.khazinagroup.org</a></div></footer>
<a href={wa(NUM.sn,"Bonjour, je souhaite en savoir plus sur vos accompagnements.")} target="_blank" rel="noopener" className={"fixed right-4 z-50 rounded-full px-5 py-3 font-bold shadow-lg "+V.green} style={{bottom:"calc(1rem + env(safe-area-inset-bottom,0px))"}}>Écrire sur WhatsApp</a>
</>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
